name: Pin set expiry

# Weekly tripwire for the TLS pin set (src-tauri/pins.json, docs/PINNING.md, audit FY-L2): fails when it expires within
# 90 days, so the rotation starts in time even when no pull request touches the Rust crate (ci.yml runs the Rust test
# only then). release.yml runs the same check with 180 days before building.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    name: Pin set expires in more than 90 days
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/release/check-pin-expiry.mjs --min-days 90
