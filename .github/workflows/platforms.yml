name: Rust on Windows and macOS

# The Windows / macOS code paths (`cfg(windows)`, `cfg(target_os = "macos")`: registry and LaunchServices browser
# detection, meeting detection, session events, their FFI) are not compiled by ci.yml, which runs Rust on Linux only.
# This workflow runs clippy and the Rust tests on GitHub-hosted Windows and macOS runners (audit GC-I4): on pull
# requests that touch the Rust side, and by hand (Actions → Run workflow, or
# `gh workflow run platforms.yml --ref <branch>`). Hosted Windows minutes count ×2 and macOS ×10, so it stays off
# every other PR. Read-only, no secrets, uploads nothing.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (clippy, tests) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Placeholder frontend (generate_context! needs ../dist)
        run: mkdir -p ../dist && echo '<!doctype html><title>TimeTrack</title>' > ../dist/index.html
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
