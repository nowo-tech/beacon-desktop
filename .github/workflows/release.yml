name: Release

# Tag-triggered only (GitHub Free plan: 2,000 private minutes/month, macOS ×10 → the macOS job runs last, once
# Linux and Windows succeeded). Installers are not code-signed (zero cost: docs/RELEASE-PLAN-0.4.0.md); updater
# artifacts ARE signed (minisign, Tauri updater) and required since 0.4.0: the build fails without
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) or while tauri.conf.json still carries the updater public key placeholder
# (scripts/release/check-updater-key.mjs). Uploads to Beacon's bucket (contract §7.1):
#   time-track-clients/desktop/<version>/<file>, then time-track-clients/desktop/channel/stable.json LAST.
# The S3 upload is skipped with a notice when its secrets are missing. The Microsoft Store MSIX job runs only when the
# MSIX_* variables are set (Partner Center → Product identity).
#
# Runners come from repository variables, so the same workflow runs on GitHub-hosted or self-hosted runners:
#   RELEASE_LINUX_RUNNER  JSON runs-on value for the Linux release jobs (prepare, build-linux, publish), e.g.
#                   ["self-hosted","linux","x64","tauri-release"]: a release-only label the runner loop serves first,
#                   so CI jobs cannot slip in between release steps. Falls back to LINUX_RUNNER.
#   LINUX_RUNNER    JSON runs-on value, e.g. ["self-hosted","linux","x64","tauri-build"]   (default "ubuntu-22.04")
#   WINDOWS_RUNNER  JSON runs-on value, e.g. ["self-hosted","windows","x64","tauri-build"] (default "windows-latest")
#   MACOS_RUNNER    JSON runs-on value, e.g. ["self-hosted","macos","tauri-build"]         (default "macos-latest")
#   WINDOWS_BUILD / MACOS_BUILD = false skip that platform: stable.json then has no entries for it in this version.
# Self-hosted runners must be ephemeral and repo-scoped (no pull_request trigger here, so forks never reach them);
# Linux ones need the Tauri system libraries, rustup and the AWS CLI preinstalled (the apt step runs on hosted only).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BEACON_URL: ${{ vars.BEACON_URL }}

jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER || vars.LINUX_RUNNER || '"ubuntu-22.04"') }}
    outputs:
      version: ${{ steps.flags.outputs.version }}
      updater: ${{ steps.flags.outputs.updater }}
      s3: ${{ steps.flags.outputs.s3 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: flags
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TIME_TRACK_S3_ENDPOINT: ${{ secrets.TIME_TRACK_S3_ENDPOINT }}
          TIME_TRACK_S3_BUCKET: ${{ secrets.TIME_TRACK_S3_BUCKET }}
          TIME_TRACK_S3_ACCESS_KEY_ID: ${{ secrets.TIME_TRACK_S3_ACCESS_KEY_ID }}
          TIME_TRACK_S3_SECRET_ACCESS_KEY: ${{ secrets.TIME_TRACK_S3_SECRET_ACCESS_KEY }}
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          have() { for v in "$@"; do [ -n "${!v}" ] || return 1; done; }
          flag() { if have "${@:3}"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; echo "::notice title=Skipped::$2 (missing: ${*:3})"; fi; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing: updater artifacts are required since 0.4.0"; exit 1; }
          node scripts/release/check-updater-key.mjs
          # TLS pin set gate (docs/PINNING.md, FY-L2): a build must keep its pinning for most of its life.
          node scripts/release/check-pin-expiry.mjs --min-days 180
          echo "updater=true" >> "$GITHUB_OUTPUT"
          flag s3 "S3 upload skipped: bundles stay as workflow artifacts" TIME_TRACK_S3_ENDPOINT TIME_TRACK_S3_BUCKET TIME_TRACK_S3_ACCESS_KEY_ID TIME_TRACK_S3_SECRET_ACCESS_KEY

  build-linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: linux
            args: --bundles deb,appimage
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER || vars.LINUX_RUNNER || '"ubuntu-22.04"') }}
    timeout-minutes: 45
    steps: &build-steps
      - uses: actions/checkout@v7
      # Self-hosted Linux runners ship these libraries in their image (no sudo there).
      - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxss-dev libx11-dev libdbus-1-dev patchelf
      # pnpm/action-setup and the actions cache for the pnpm store are skipped on self-hosted Linux (image pnpm via
      # corepack, persistent store), kept elsewhere.
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # Self-hosted Linux images ship pnpm through corepack and a persistent pnpm store: use them, check the version
      # against packageManager, and fall back to a corepack shim in RUNNER_TEMP when the image's pnpm differs.
      - name: pnpm from the runner image (corepack)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          have="$(pnpm --version 2>/dev/null || true)"
          if [ "$have" != "$want" ]; then
            echo "::notice::runner pnpm '${have:-none}' != packageManager $want, using corepack"
            corepack enable pnpm --install-directory "$RUNNER_TEMP/corepack-bin"
            echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
            have="$("$RUNNER_TEMP/corepack-bin/pnpm" --version)"
          fi
          echo "pnpm $have"
          [ "$have" = "$want" ]
      # Runner's rustup, no third-party toolchain action and no shared cache in the job that holds the signing key.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - run: pnpm install --frozen-lockfile
      # The public key is in tauri.conf.json; the optional TAURI_UPDATER_PUBKEY variable overrides it (also compiled into
      # the binary, see src-tauri/build.rs). beforeBuildCommand runs scripts/release/check-updater-key.mjs again.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            node -e 'console.log(JSON.stringify({plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY}}}))' > "$RUNNER_TEMP/tauri.release.json"
          else
            echo '{}' > "$RUNNER_TEMP/tauri.release.json"
          fi
          pnpm tauri build ${{ matrix.args }} --config "$RUNNER_TEMP/tauri.release.json"
      - name: Collect bundles and stable.json entries
        shell: bash
        run: scripts/release/collect-desktop.sh ${{ matrix.os }} "${{ needs.prepare.outputs.version }}" out "${{ matrix.bundle }}" "${{ needs.prepare.outputs.updater }}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: out/
          retention-days: 30
      # Ephemeral runners are discarded anyway; a reused one must not keep build trees between jobs.
      - name: Clean build tree (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf src-tauri/target out node_modules dist "$RUNNER_TEMP/tauri.release.json"

  build-windows:
    needs: prepare
    if: vars.WINDOWS_BUILD != 'false'
    strategy:
      matrix:
        include:
          - os: windows
            # NSIS only, per-user (no UAC). MSI is not built since 0.4.0: an MSI install cannot take the NSIS updater.
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    timeout-minutes: 45
    steps: *build-steps

  # Last: macOS minutes count ×10, so it only runs after Linux and Windows succeeded (or Windows was switched off).
  build-macos:
    needs: [prepare, build-linux, build-windows]
    if: >-
      ${{ !cancelled() && vars.MACOS_BUILD != 'false' && needs.build-linux.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.build-windows.result) }}
    strategy:
      matrix:
        include:
          - os: darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '"macos-latest"') }}
    timeout-minutes: 45
    steps: *build-steps

  # Microsoft Store package (MSIX, unsigned: the Store re-signs it). Upload it by hand in Partner Center.
  store-msix:
    needs: [prepare, build-windows]
    if: vars.MSIX_IDENTITY_NAME != '' && vars.WINDOWS_BUILD != 'false'
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    timeout-minutes: 45
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      TIMETRACK_STORE_URL: ${{ vars.TIMETRACK_STORE_URL }}
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup and the actions cache for the pnpm store are skipped on self-hosted Linux (image pnpm via
      # corepack, persistent store), kept elsewhere.
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # Self-hosted Linux images ship pnpm through corepack and a persistent pnpm store: use them, check the version
      # against packageManager, and fall back to a corepack shim in RUNNER_TEMP when the image's pnpm differs.
      - name: pnpm from the runner image (corepack)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          have="$(pnpm --version 2>/dev/null || true)"
          if [ "$have" != "$want" ]; then
            echo "::notice::runner pnpm '${have:-none}' != packageManager $want, using corepack"
            corepack enable pnpm --install-directory "$RUNNER_TEMP/corepack-bin"
            echo "$RUNNER_TEMP/corepack-bin" >> "$GITHUB_PATH"
            have="$("$RUNNER_TEMP/corepack-bin/pnpm" --version)"
          fi
          echo "pnpm $have"
          [ "$have" = "$want" ]
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: pwsh scripts/store/build-msix.ps1 -Arch x64
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-store-msix
          path: out/store/*.msix
          retention-days: 30
      - name: Clean build tree (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: rm -rf src-tauri/target out node_modules dist

  # A switched-off (skipped) Windows / macOS build simply leaves its platform out of stable.json for this version.
  publish:
    needs: [prepare, build-linux, build-windows, build-macos]
    if: >-
      ${{ !cancelled() && needs.build-linux.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.build-windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-macos.result) }}
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_RUNNER || vars.LINUX_RUNNER || '"ubuntu-22.04"') }}
    env:
      TIME_TRACK_S3_ENDPOINT: ${{ secrets.TIME_TRACK_S3_ENDPOINT }}
      TIME_TRACK_S3_BUCKET: ${{ secrets.TIME_TRACK_S3_BUCKET }}
      TIME_TRACK_S3_ACCESS_KEY_ID: ${{ secrets.TIME_TRACK_S3_ACCESS_KEY_ID }}
      TIME_TRACK_S3_SECRET_ACCESS_KEY: ${{ secrets.TIME_TRACK_S3_SECRET_ACCESS_KEY }}
      TIME_TRACK_S3_REGION: ${{ secrets.TIME_TRACK_S3_REGION }}
      MIN_SUPPORTED_VERSION: ${{ vars.TIME_TRACK_MIN_SUPPORTED_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: stable.json
        run: |
          node scripts/release/channel.mjs stable --version "${{ needs.prepare.outputs.version }}" --changelog CHANGELOG.md \
            ${MIN_SUPPORTED_VERSION:+--min "$MIN_SUPPORTED_VERSION"} out/*.jsonl > stable.json
          cat stable.json
      - name: Upload to Beacon's bucket (files first, stable.json last)
        if: needs.prepare.outputs.s3 == 'true'
        run: |
          for key in $(node -e 'for (const f of require("./stable.json").files) console.log(f.key)' | sort -u); do
            scripts/release/s3-put.sh "out/$(basename "$key")" "$key"
          done
          scripts/release/s3-put.sh stable.json time-track-clients/desktop/channel/stable.json application/json
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-stable-json
          path: stable.json
