name: Installer upgrade test

# Manual only (Windows minutes cost 2x): installs an older TimeTrack on a clean GitHub-hosted Windows runner, upgrades
# it with a newer NSIS installer and checks the result (scripts/windows/upgrade-test.ps1): installer exit code, one
# single "TimeTrack" Uninstall entry with the new version, no old MSI left, the app starts; from 0.5.1 on also one
# single start-at-login entry (seeded duplicates removed) and a second launch exiting at once (one tray icon). Each
# scenario is its own job, so each one starts from a clean machine.
#
# Inputs:
#   old_run_id   Release run whose "desktop-windows" artifact holds the oldest installers (default: v0.1.0, MSI + NSIS,
#                published without `bundle.publisher`, so the Windows "manufacturer" was "nowo").
#   prev_run_id  Release run of the previous direct-download version (default: v0.4.0, NSIS per user, publisher
#                "nowo.tech"), the starting point of the in-app updater route.
#   new_run_id   Run whose "desktop-windows" (release) or "new-installer" (this workflow) artifact is the new version.
#                Empty: build this ref's NSIS installer here, signed with a throwaway updater key (never the release one).
#   version      Version stamped on the build of this ref (empty: DEFAULT_VERSION). Ignored with new_run_id.
#   scenarios    "all" or a comma-separated list of scenario ids (see the plan job).
# Artifacts of other runs expire after 30 days (release.yml retention): pass a newer run or rebuild the old tag then.
#
# Never published (audit GC-I6): the installer built here embeds a THROWAWAY updater public key, so it must never reach
# users. This workflow has read-only permissions and no S3 / release secrets, it never runs on a tag, and it only uploads
# the workflow artifact "new-installer" (7 days) with a DO-NOT-PUBLISH marker file. release.yml builds every installer
# itself from the tag, only downloads "desktop-*" artifacts of its own run, and refuses to publish when a marker is
# among them.
#
# GitHub only dispatches workflows that exist on the default branch. Until this file is on main, push any ref to a
# branch named ci/installer-upgrade-test/<anything>: that runs with the defaults below (DEFAULT_*), building the ref.
on:
  push:
    branches: ['ci/installer-upgrade-test/**']
  workflow_dispatch:
    inputs:
      old_run_id:
        description: Release run with the oldest installers (v0.1.0)
        default: '41621683190'
      prev_run_id:
        description: Release run with the previous version's installer (v0.4.0)
        default: '41895956986'
      new_run_id:
        description: Run with the new installer (empty = build this ref)
        default: ''
      version:
        description: Version stamped on the build of this ref
        default: '0.6.0'
      scenarios:
        description: all, or comma-separated scenario ids
        default: all

permissions:
  contents: read
  actions: read # artifacts of the release runs

concurrency:
  group: installer-upgrade-test-${{ github.ref }}
  cancel-in-progress: false

env:
  # Used on push (no inputs) and for inputs left empty.
  DEFAULT_OLD_RUN_ID: '41621683190'
  DEFAULT_PREV_RUN_ID: '41895956986'
  DEFAULT_NEW_RUN_ID: ''
  DEFAULT_VERSION: '0.6.0'
  DEFAULT_SCENARIOS: all

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      old_run_id: ${{ steps.plan.outputs.old_run_id }}
      prev_run_id: ${{ steps.plan.outputs.prev_run_id }}
      new_run_id: ${{ steps.plan.outputs.new_run_id }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          SCENARIOS: ${{ inputs.scenarios || env.DEFAULT_SCENARIOS }}
          OLD_RUN_ID: ${{ inputs.old_run_id || env.DEFAULT_OLD_RUN_ID }}
          PREV_RUN_ID: ${{ inputs.prev_run_id || env.DEFAULT_PREV_RUN_ID }}
          NEW_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.new_run_id || env.DEFAULT_NEW_RUN_ID }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || env.DEFAULT_VERSION }}
        run: |
          {
            echo "old_run_id=$OLD_RUN_ID"
            echo "prev_run_id=$PREV_RUN_ID"
            echo "new_run_id=$NEW_RUN_ID"
            echo "version=$VERSION"
          } | tee -a "$GITHUB_OUTPUT"
          # id: old installers (v01 = old_run_id, v04 = prev_run_id) and which of them, how the new one runs, app running.
          # autostart (0.5.1+, default dupes): which start-at-login entries are seeded before the upgrade (upgrade-test.ps1);
          # install_dir: a custom install folder (/D=), fresh install (old none).
          # msi_stays: /S shows no page and cannot ask for administrator approval, so a 0.1.0 MSI is left installed
          # (expected; the check reports it instead of failing).
          all='[
            {"id":"nsis01-interactive-running","from":"v01","old":"nsis","mode":"interactive","running":true},
            {"id":"nsis01-silent","from":"v01","old":"nsis","mode":"silent","running":false},
            {"id":"nsis01-update-running","from":"v01","old":"nsis","mode":"update","running":true},
            {"id":"msi01-interactive-running","from":"v01","old":"msi","mode":"interactive","running":true},
            {"id":"msi01-silent","from":"v01","old":"msi","mode":"silent","running":false,"msi_stays":true},
            {"id":"both01-interactive","from":"v01","old":"both","mode":"interactive","running":false},
            {"id":"v04-update-running","from":"v04","old":"nsis","mode":"update","running":true},
            {"id":"v04-interactive-running","from":"v04","old":"nsis","mode":"interactive","running":true},
            {"id":"v04-update-autostart-disabled","from":"v04","old":"nsis","mode":"update","running":true,"autostart":"disabled"},
            {"id":"msi01-interactive-autostart-foreign","from":"v01","old":"msi","mode":"interactive","running":false,"autostart":"foreign"},
            {"id":"custom-dir-silent-autostart","from":"v04","old":"none","mode":"silent","running":false,"autostart":"custom","install_dir":"C:\\My Tools\\TimeTrack"}
          ]'
          if [ "$SCENARIOS" = all ]; then
            matrix="$(jq -c '{include: .}' <<<"$all")"
          else
            matrix="$(jq -c --arg s "$SCENARIOS" '($s | split(",") | map(gsub("^ +| +$"; ""))) as $want | {include: map(select(.id as $id | $want | index($id)))}' <<<"$all")"
          fi
          [ "$(jq '.include | length' <<<"$matrix")" -gt 0 ] || { echo "::error::no scenario matches '$SCENARIOS'"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  build:
    needs: plan
    # Never on a tag: a release is built by release.yml only (GC-I6).
    if: needs.plan.outputs.new_run_id == '' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: pnpm install --frozen-lockfile
      # A throwaway updater key: the build produces the .sig like a release, but nothing here can sign a real update.
      - name: Build the NSIS installer (throwaway updater key)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          pnpm tauri signer generate --ci -p throwaway -w "$RUNNER_TEMP/throwaway.key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=throwaway
          TAURI_UPDATER_PUBKEY="$(cat "$RUNNER_TEMP/throwaway.key.pub")"
          export TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBKEY
          node -e '
            const c = { plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY } } };
            if (process.env.VERSION) c.version = process.env.VERSION;
            console.log(JSON.stringify(c));' > "$RUNNER_TEMP/tauri.test.json"
          cat "$RUNNER_TEMP/tauri.test.json"
          pnpm tauri build --bundles nsis --config "$RUNNER_TEMP/tauri.test.json"
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/
          # GC-I6: marks this build as a test build; release.yml refuses to publish anything next to this file.
          echo "Test build of $GITHUB_REF ($GITHUB_SHA) with a throwaway updater key. Never publish it." > out/THROWAWAY-UPDATER-KEY-DO-NOT-PUBLISH.txt
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: new-installer
          path: out/
          retention-days: 7

  upgrade:
    name: ${{ matrix.id }}
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/windows
      - name: Old installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-windows
          path: old
          run-id: ${{ matrix.from == 'v04' && needs.plan.outputs.prev_run_id || needs.plan.outputs.old_run_id }}
          github-token: ${{ github.token }}
      - name: New installer (this run's build)
        if: needs.plan.outputs.new_run_id == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: new-installer
          path: new
      - name: New installer (another run, release or this workflow)
        if: needs.plan.outputs.new_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: '{desktop-windows,new-installer}'
          merge-multiple: true
          path: new
          run-id: ${{ needs.plan.outputs.new_run_id }}
          github-token: ${{ github.token }}
      - name: Upgrade and check
        shell: powershell
        run: |
          $running = '${{ matrix.running }}' -eq 'true'
          $msiStays = '${{ matrix.msi_stays }}' -eq 'true'
          $autostart = '${{ matrix.autostart }}'
          if (-not $autostart) { $autostart = 'dupes' }
          $installDir = '${{ matrix.install_dir }}'
          & .\scripts\windows\upgrade-test.ps1 -Old ${{ matrix.old }} -OldDir old -NewDir new -Mode ${{ matrix.mode }} -AppRunning:$running -OldMsiStays:$msiStays -Autostart $autostart -InstallDir $installDir -OutDir out
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-${{ matrix.id }}
          path: out/
          retention-days: 14
