name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste tokens, app passwords, e-mails or screenshots with personal data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS (or desktop OS)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, expected and actual result
    validations:
      required: true
