[package]
name = "time-track-desktop"
version = "0.1.0"
description = "TimeTrack desktop app for symfony-beacon"
authors = ["nowo.tech"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "time_track_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
user-idle = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Native friendly-message notifications with the pose picture and click handling (notify.rs); already used by
# tauri-plugin-notification, same version.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# Windows toasts with the pose as the square app logo (notify.rs).
tauri-winrt-notification = "0.8"
# Meeting detection: the microphone consent store (meeting/windows.rs); already used by tauri-plugin-autostart.
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
# Meeting detection: CoreAudio bundle ids and process names (meeting/macos.rs); both already used by Tauri.
core-foundation-sys = "0.8"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
