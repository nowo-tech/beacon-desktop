[package]
name = "time-track-desktop"
version = "0.1.0"
description = "TimeTrack desktop app for symfony-beacon"
authors = ["nowo.tech"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "time_track_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Settings → "Open Beacon in" → Custom…: the native file picker (main window only).
tauri-plugin-dialog = "2"
# "Copy link" next to every Beacon link (write-text permission only, main window).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
user-idle = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Native friendly-message notifications with the pose picture and click handling (notify.rs); already used by
# tauri-plugin-notification, same version.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# Installed browsers (StartMenuInternet, App Paths) for "Open Beacon in" (browser.rs); already in the tree.
winreg = "0.56"
# Windows toasts with the pose as the square app logo (notify.rs).
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# LaunchServices https handlers for "Open Beacon in" (browser.rs); already in the tree.
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
