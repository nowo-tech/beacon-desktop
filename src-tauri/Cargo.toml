[package]
name = "time-track-desktop"
version = "0.14.2"
description = "Beacon Desktop (formerly TimeTrack desktop) for symfony-beacon"
authors = ["nowo.tech"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "time_track_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Settings → "Open Beacon in" → Custom…: the native file picker (main window only).
tauri-plugin-dialog = "2"
# "Copy link" next to every Beacon link (write-text permission only, main window).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
user-idle = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Beacon API traffic goes through Rust with TLS public-key pinning (src/pinning.rs, src/net.rs, docs/PINNING.md).
# Same reqwest / rustls / webpki versions as tauri-plugin-updater, which reuses the pinned TLS configuration.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.22"
# Chat realtime stream (realtime.rs): timers and the stop signal; already in the tree (Tauri's async runtime).
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# One process per user: a second launch (Start menu, a duplicate start-at-login entry) hands over to the running app
# and exits, so there is never a second tray icon (lib.rs `single_instance`).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# `beacon-desktop://` links (deeplink.rs): macOS Apple events, Windows / Linux arguments via the single instance.
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Native friendly-message notifications with the pose picture and click handling (notify.rs); already used by
# tauri-plugin-notification, same version.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# Installed browsers (StartMenuInternet, App Paths) for "Open Beacon in" (browser.rs) and the microphone consent store
# for meeting detection (meeting/windows.rs); already in the tree (tauri-plugin-autostart).
winreg = "0.56"
# Windows toasts with the pose as the square app logo (notify.rs).
tauri-winrt-notification = "0.8"
# Screen lock / sleep events (session.rs): WTS session notifications and power broadcasts to a hidden window; the
# process token's elevation (autostart.rs: start at login is never switched on from an elevated process).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading"] }

# Screen lock / sleep events (session.rs): logind on the system D-Bus (already used by notify-rust, same version).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Screen lock / sleep events (session.rs): distributed and workspace notifications (already used by Tauri, same versions).
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# LaunchServices https handlers for "Open Beacon in" (browser.rs); already in the tree.
core-foundation = "0.10"
# Meeting detection: CoreAudio bundle ids and process names (meeting/macos.rs); both already used by Tauri.
core-foundation-sys = "0.8"
libc = "0.2"

[dev-dependencies]
# Test CAs, leaves and the local TLS mock server are generated at test time (no key material in the repository).
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
