[package]
name = "time-track-desktop"
version = "0.5.0"
description = "TimeTrack desktop app for symfony-beacon"
authors = ["nowo.tech"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "time_track_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Settings → "Open Beacon in" → Custom…: the native file picker (main window only).
tauri-plugin-dialog = "2"
# "Copy link" next to every Beacon link (write-text permission only, main window).
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
user-idle = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Native friendly-message notifications with the pose picture and click handling (notify.rs); already used by
# tauri-plugin-notification, same version.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# Installed browsers (StartMenuInternet, App Paths) for "Open Beacon in" (browser.rs) and the microphone consent store
# for meeting detection (meeting/windows.rs); already in the tree (tauri-plugin-autostart).
winreg = "0.56"
# Windows toasts with the pose as the square app logo (notify.rs).
tauri-winrt-notification = "0.8"
# Screen lock / sleep events (session.rs): WTS session notifications and power broadcasts to a hidden window.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

# Screen lock / sleep events (session.rs): logind on the system D-Bus (already used by notify-rust, same version).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Screen lock / sleep events (session.rs): distributed and workspace notifications (already used by Tauri, same versions).
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# LaunchServices https handlers for "Open Beacon in" (browser.rs); already in the tree.
core-foundation = "0.10"
# Meeting detection: CoreAudio bundle ids and process names (meeting/macos.rs); both already used by Tauri.
core-foundation-sys = "0.8"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
