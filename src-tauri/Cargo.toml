[package]
name = "time-track-desktop"
version = "0.1.0"
description = "TimeTrack desktop app for symfony-beacon"
authors = ["nowo.tech"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "time_track_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
user-idle = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Beacon API traffic goes through Rust with TLS public-key pinning (src/pinning.rs, src/net.rs, docs/PINNING.md).
# Same reqwest / rustls / webpki versions as tauri-plugin-updater, which reuses the pinned TLS configuration.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Native friendly-message notifications with the pose picture and click handling (notify.rs); already used by
# tauri-plugin-notification, same version.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# Windows toasts with the pose as the square app logo (notify.rs).
tauri-winrt-notification = "0.8"

[dev-dependencies]
# Test CAs, leaves and the local TLS mock server are generated at test time (no key material in the repository).
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
